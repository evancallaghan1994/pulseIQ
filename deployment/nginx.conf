# PulseIQ — Nginx reverse proxy configuration
# Replace 'yourdomain.com' with your actual domain or server IP.
#
# Install:
#   cp deployment/nginx.conf /etc/nginx/sites-available/pulseiq
#   ln -s /etc/nginx/sites-available/pulseiq /etc/nginx/sites-enabled/pulseiq
#   nginx -t && systemctl reload nginx
#
# For SSL (production): run certbot --nginx -d yourdomain.com

server {
    listen 80;
    server_name yourdomain.com;

    # ── Streamlit dashboard ──────────────────────────────────────────────────
    location / {
        proxy_pass         http://localhost:8501;
        proxy_http_version 1.1;

        # Required for Streamlit WebSocket connections
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # ── Airflow UI ───────────────────────────────────────────────────────────
    location /airflow/ {
        proxy_pass         http://localhost:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── MLflow UI (internal access only — remove if not needed publicly) ─────
    location /mlflow/ {
        proxy_pass         http://localhost:5000/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
